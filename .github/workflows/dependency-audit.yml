name: Dependency Audit

on:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Audit backend dependencies
        run: cd backend && bun install --frozen-lockfile && bun audit --production
      - name: Audit frontend dependencies
        run: cd frontend && bun install --frozen-lockfile && bun audit --production
